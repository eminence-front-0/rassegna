name: Rassegna del mattino

on:
  schedule:
    # Obiettivo: 08:00, 13:00, 18:00 e 23:00 ORA ITALIANA. GitHub ragiona in UTC e l'Italia cambia ora due volte l'anno,
    # quindi si parte a entrambe le ore possibili (legale e solare) e il primo passo tiene solo quella giusta.
    - cron: "10 6,7,11,12,16,17,21,22 * * *"
  workflow_dispatch:       # permette di lanciarla a mano dal sito di GitHub

permissions:
  contents: write          # conserva edizioni passate, loghi e memoria nel repository
  issues: write            # legge e chiude le segnalazioni con le tue preferenze
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    outputs:
      vai: ${{ steps.ora.outputs.vai }}
    steps:
      - id: ora
        run: |
          H=$(TZ=Europe/Rome date +%H)
          echo "Ora italiana: $H"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || echo "08 13 18 23" | grep -qw "$H"; then echo "vai=true" >> "$GITHUB_OUTPUT"; else echo "vai=false" >> "$GITHUB_OUTPUT"; fi

  genera:
    needs: controlla
    if: needs.controlla.outputs.vai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python3 -m unittest discover -s tests
        continue-on-error: true   # un test rotto non deve fermare l'edizione del giorno
      - name: Genera la pagina
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RASSEGNA_STATO: "1"
          TZ: Europe/Rome
        run: python3 aggregatore.py
      - name: Conserva edizione, loghi e memoria
        run: |
          git config user.name "rassegna-bot"
          git config user.email "rassegna-bot@users.noreply.github.com"
          git add docs/archivio docs/logos data/stato.json
          git diff --cached --quiet || git commit -m "Edizione del $(TZ=Europe/Rome date +%F)"
          git pull --rebase -q origin main || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
