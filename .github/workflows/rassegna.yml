name: Rassegna del mattino

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC = 5:00 (ora legale) / 4:00 (ora solare) in Italia
  workflow_dispatch:       # permette di lanciarla a mano dal sito di GitHub

permissions:
  contents: write          # conserva edizioni passate, loghi e memoria nel repository
  issues: write            # legge e chiude le segnalazioni con le tue preferenze
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python3 -m unittest discover -s tests
        continue-on-error: true   # un test rotto non deve fermare l'edizione del giorno
      - name: Genera la pagina
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RASSEGNA_STATO: "1"
          TZ: Europe/Rome
        run: python3 aggregatore.py
      - name: Conserva edizione, loghi e memoria
        run: |
          git config user.name "rassegna-bot"
          git config user.email "rassegna-bot@users.noreply.github.com"
          git add docs/archivio docs/logos data/stato.json
          git diff --cached --quiet || git commit -m "Edizione del $(TZ=Europe/Rome date +%F)"
          git pull --rebase -q origin main || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
